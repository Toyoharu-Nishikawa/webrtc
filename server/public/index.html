<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebRTC Camera Stream</title>
</head>
<body>
  <h1>WebRTC Live Stream</h1>
  <button id="startButton">Start Stream</button>
  <video id="video" autoplay playsinline style="width: 320px; height: 240px; background: black;"></video>

  <script src="https://cdn.socket.io/4.7.1/socket.io.min.js"></script>
  <script>
    const socket = io();
    const video = document.getElementById("video");

    async function start() {
      const pc = new RTCPeerConnection({
//        iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
      });
      pc.addTransceiver("video", { direction: "recvonly" });

      pc.ontrack = (event) => {
        console.log("ontrack: stream received");
        console.log("ontrack streams:", event.streams);
        console.log("track kind:", event.track.kind);
        console.log("track readyState:", event.track.readyState);
        console.log("track enabled:", event.track.enabled);
        if (video.srcObject) {
          console.log("Current tracks:", video.srcObject.getTracks());
        } else {
          console.log("No stream assigned yet");
        }
        if (event.streams && event.streams[0]) {
          console.log("Assigning stream from event.streams[0]");
          video.srcObject = event.streams[0];
        } else {
          console.log("Creating new MediaStream with track");
          const stream = new MediaStream([event.track]);
          video.srcObject = stream;
        }
        video.play().catch((e) => console.error("Video play error:", e));
        console.log("Video srcObject tracks after assignment:", video.srcObject.getTracks());
      };

      // ICE candidate (クライアント → サーバ)
      pc.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit("ice-candidate", event.candidate);
        }
      };

      // サーバからのICE candidate
      socket.on("ice-candidate", async (candidate) => {
        await pc.addIceCandidate(candidate);
      });

      // サーバからのanswerを受信
      socket.on("answer", async (answer) => {
        console.log("on answer",answer.sdp);

        await pc.setRemoteDescription(answer);
      });

      // オファー作成＆送信
      const offer = await pc.createOffer();
      console.log(offer.sdp)
      await pc.setLocalDescription(offer);
      socket.emit("offer", offer);

      console.log("offer sent to server");
    }

    // ボタンクリックで start() を実行
    startButton.addEventListener("click", () => {
      start();
      startButton.disabled = true; // 2回クリック防止
    });
  </script>
</body>
</html>
